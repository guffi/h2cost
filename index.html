<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H2 Cost</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7faf9;
      color: #17211f;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;

    main {
      width: min(760px, 100%);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(40px, 8vw, 84px);
      line-height: 0.95;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      max-width: 560px;
      font-size: 20px;
      line-height: 1.55;
      color: #40514d;
    }
  </style>
</head>
<body>
  <main>
    <h1>H2 Cost</h1>
    <p>A simple starter page for the hydrogen cost project. This repository is ready to publish with GitHub Pages.</p>
  </main>

</html>
